name: "~Ensure release"

# Reusable workflow: given one component name (or "all"), creates or
# updates its Python 3.12 GitHub Release(s):
#   tag:   "<component>-<ref>-py3.12-torch<torch>"
#          e.g. "transformer-engine-v2.16.1-py3.12-torch2.13.0"
#   title: "<component> <ref> - cu<cuda> py3.12 torch<torch>[; ...]"
#          e.g. "transformer-engine v2.16.1 - cu13.0.2 py3.12 torch2.13.0"
# It runs on Python 3.12 and calls ci/release_meta.py without --python or
# --torch, so release_meta self-selects the running interpreter and the one
# torch the build_matrix pins for it.
#
# NOTHING CALLS THIS. Releases are created inline by _build.yml's "Ensure
# release" step while uploading, for every (component, Python, torch) the
# matrix covers; this workflow is kept only as a manual way to pre-create or
# refresh a 3.12 release without building. A release is created once per
# (component, ref, Python, torch) and reused - title kept in sync - across
# every subsequent build of that same combination; bumping ref or torch in
# versions.yaml starts a brand new release, leaving the old one as a
# historical record.

on:
  workflow_call:
    inputs:
      component:
        description: "Component name from versions.yaml, or 'all' for every component"
        required: true
        type: string

permissions:
  contents: write

jobs:
  compute-release-meta:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: meta
        run: python3 ci/release_meta.py --component "${{ inputs.component }}" --github-output

  ensure-release:
    needs: compute-release-meta
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compute-release-meta.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Create or update release ${{ matrix.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ matrix.title }}
          NOTES: ${{ matrix.notes }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE"
            echo "Updated release $TAG (title refreshed in case build_matrix changed)."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
            echo "Created release $TAG."
          fi
