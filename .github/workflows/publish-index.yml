name: Publish package index

# (Re)builds the static PEP 503 "simple" index from every .whl currently
# attached to any GitHub Release, and deploys it to GitHub Pages. Chained
# from release.yml / build-<component>.yml only after a successful build;
# can also be run standalone via workflow_dispatch to refresh the index
# without rebuilding any wheels.

on:
  workflow_dispatch:
    inputs:
      allow_partial:
        description: >-
          Publish even when the coverage gate reports missing wheels. Leave
          unchecked (default): fail-closed, a partial world blocks the publish.
        type: boolean
        default: false
  workflow_call:
    inputs:
      allow_partial:
        description: >-
          Publish even when the coverage gate reports missing wheels
          (default: fail-closed).
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_index reads versions.yaml (through generate_matrix) to decide
      # which CUDA/torch world /simple/ aliases.
      - run: pip install pyyaml

      - name: Generate PEP 503 index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 ci/build_index.py
          --repo "${{ github.repository }}"
          --out-dir _site
          ${{ inputs.allow_partial && '--allow-partial' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-index
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
